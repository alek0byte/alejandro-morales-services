<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
{{#if noindex}}
  <meta name="robots" content="noindex">
{{/if}}
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
{{#if full_meta}}
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{owner}} · Servicios informáticos">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{og_description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{owner}} · Servicios informáticos">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{twitter_description}}">
  <meta name="twitter:image" content="{{og_image}}">
{{/if}}
  <link rel="icon" href="{{root}}assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="{{root}}assets/img/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
{{#if full_meta}}
  <link rel="preload" href="{{root}}assets/fonts/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
{{/if}}
  <link rel="stylesheet" href="{{root}}assets/css/fonts.css">
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
{{#if jsonld}}
  <script type="application/ld+json">
{{{jsonld}}}
  </script>
{{/if}}
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
{{> header}}
{{{content}}}
{{> footer}}
{{#if floating}}
<a class="floating-whatsapp" href="{{wa_link}}" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp">↗ <span>WhatsApp</span></a>
{{/if}}
<script src="{{root}}assets/js/site.js"></script>{{{extra_scripts}}}
</body>
</html>
